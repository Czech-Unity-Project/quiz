name: Build and deploy

on:
  push:
    # TEMPORARY: showcase deploys the whole site (game + /showcase/) until it's merged into main.
    # Whichever branch deploys last replaces the entire site. Remove `showcase` once merged.
    branches: [main, showcase]
  pull_request:
    branches: [main]
  workflow_dispatch:

# PR runs cancel older runs of the same PR; deploys on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Only on main (push/merge or manual run), never on a PR.
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # One Pages site: deploys from different branches queue instead of overlapping.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
